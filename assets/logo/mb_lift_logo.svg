<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" width="1536" height="1024">
  <defs>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a3f63"/>
      <stop offset="50%" stop-color="#16233c"/>
      <stop offset="100%" stop-color="#0c1626"/>
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e6e8ea"/>
      <stop offset="45%" stop-color="#9aa0a6"/>
      <stop offset="100%" stop-color="#5b5f63"/>
    </linearGradient>
    <linearGradient id="navyGradSmall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#233752"/>
      <stop offset="100%" stop-color="#0e1930"/>
    </linearGradient>
  </defs>

  <rect width="1536" height="1024" fill="#f7f7f7"/>

  <!-- ===================== TOP EMBLEM ===================== -->
  <g font-family="Arial, Helvetica, sans-serif" font-weight="900">

    <!-- Letter M (navy) -->
    <path d="M360 580 L360 210 L455 210 L560 400 L665 210 L760 210 L760 580 L680 580 L680 340 L580 520 L540 520 L440 340 L440 580 Z"
          fill="url(#navyGrad)" stroke="#0a1320" stroke-width="4"/>

    <!-- Letter B (silver) -->
    <path d="M880 210 L1060 210 C1130 210 1175 250 1175 305 C1175 340 1158 365 1130 380 C1165 393 1188 422 1188 462 C1188 522 1140 580 1060 580 L880 580 Z
              M955 270 L955 355 L1050 355 C1082 355 1102 335 1102 310 C1102 285 1082 270 1050 270 Z
              M955 415 L955 520 L1055 520 C1092 520 1115 500 1115 467 C1115 435 1092 415 1055 415 Z"
          fill="url(#silverGrad)" fill-rule="evenodd" stroke="#4a4e52" stroke-width="4"/>

    <!-- Crane frame + hook, centered between M and B -->
    <g stroke="#16233c" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M700 250 L768 150 L836 250" fill="url(#navyGradSmall)" />
      <line x1="700" y1="250" x2="700" y2="480"/>
      <line x1="836" y1="250" x2="836" y2="480"/>
      <line x1="768" y1="165" x2="768" y2="330"/>
    </g>

    <!-- Pulley ring -->
    <circle cx="768" cy="255" r="16" fill="none" stroke="#16233c" stroke-width="8"/>

    <!-- Hook -->
    <path d="M768 330 C768 330 730 335 730 375 C730 405 755 420 775 415 C795 410 800 390 790 378"
          fill="none" stroke="#16233c" stroke-width="10" stroke-linecap="round"/>

    <!-- Load block -->
    <rect x="738" y="415" width="60" height="55" rx="6" fill="url(#navyGradSmall)" stroke="#0a1320" stroke-width="6"/>
    <rect x="758" y="428" width="20" height="30" fill="#f7f7f7" opacity="0.15"/>

    <!-- Gear at base -->
    <g fill="url(#navyGradSmall)" stroke="#0a1320" stroke-width="4">
      <path d="M768 460
               m-135,0
               a135,135 0 1,0 270,0
               a135,135 0 1,0 -270,0" opacity="0"/>
      <!-- simplified gear ring using teeth -->
    </g>
    <g transform="translate(768,510)">
      <g fill="url(#navyGradSmall)" stroke="#0a1320" stroke-width="3">
        <!-- gear teeth -->
        <g id="tooth">
          <rect x="-14" y="-150" width="28" height="34" rx="4"/>
        </g>
        <use href="#tooth" transform="rotate(0)"/>
        <use href="#tooth" transform="rotate(30)"/>
        <use href="#tooth" transform="rotate(60)"/>
        <use href="#tooth" transform="rotate(90)"/>
        <use href="#tooth" transform="rotate(120)"/>
        <use href="#tooth" transform="rotate(150)"/>
        <use href="#tooth" transform="rotate(180)"/>
        <use href="#tooth" transform="rotate(210)"/>
        <use href="#tooth" transform="rotate(240)"/>
        <use href="#tooth" transform="rotate(270)"/>
        <use href="#tooth" transform="rotate(300)"/>
        <use href="#tooth" transform="rotate(330)"/>
        <circle r="120" fill="none" stroke="#0a1320" stroke-width="26"/>
      </g>
      <!-- cut out top arc so gear frames the hook, matching original where gear sits behind/around hook base -->
      <path d="M-150,-40 A150,150 0 0,0 150,-40 L120,-40 A120,120 0 0,1 -120,-40 Z" fill="#f7f7f7"/>
    </g>
  </g>

  <!-- ===================== WORDMARK ===================== -->
  <g font-family="Arial, Helvetica, sans-serif" font-weight="900" text-anchor="middle">
    <text x="620" y="770" font-size="120" fill="url(#navyGrad)" letter-spacing="4">MB</text>
    <text x="960" y="770" font-size="120" fill="url(#silverGrad)" letter-spacing="4">LIFT</text>
  </g>

  <!-- Tagline -->
  <g font-family="Arial, Helvetica, sans-serif" font-weight="600" text-anchor="middle">
    <text x="768" y="825" font-size="34" fill="#16233c" letter-spacing="10">ENGINEERED TO ELEVATE</text>
  </g>

  <!-- Decorative side lines -->
  <g stroke="#16233c" stroke-width="3">
    <line x1="200" y1="750" x2="330" y2="750"/>
    <line x1="1210" y1="750" x2="1340" y2="750"/>
  </g>
  <g stroke="#16233c" stroke-width="2">
    <line x1="380" y1="855" x2="700" y2="855"/>
    <line x1="836" y1="855" x2="1156" y2="855"/>
  </g>
  <path d="M718 855 L768 875 L818 855 Z" fill="#16233c"/>
</svg>
